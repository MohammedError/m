<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>Adaptive User Interfaces — Thesis Defense</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">AUI</span>
        <span class="brand-copy">Research Defense</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="notesToggle" type="button" title="Toggle speaker notes (N)" aria-label="Toggle speaker notes">N</button>
        <button class="icon-btn" id="fullscreenBtn" type="button" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
      </div>
    </header>

    <main class="stage" id="stage" aria-live="polite">
      <!-- Slides are injected by script.js -->
    </main>

    <aside class="notes-panel" id="notesPanel" aria-hidden="true">
      <div class="notes-head">
        <span>Speaker Notes</span>
        <button class="icon-btn small" id="notesClose" type="button" aria-label="Close speaker notes">×</button>
      </div>
      <div class="notes-body" id="notesBody"></div>
    </aside>

    <footer class="controls">
      <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous slide">← <span>Previous</span></button>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="counter">01 / 22</span>
          <span id="slideTitle">Title</span>
        </div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>
      <button class="nav-btn" id="nextBtn" type="button" aria-label="Next slide"><span>Next</span> →</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
